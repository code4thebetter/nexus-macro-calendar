name: NEXUS Macro Calendar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run NEXUS macro collector
        run: npm run collect

      - name: Validate generated calendar
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(
            fs.readFileSync('data/macro-calendar.json', 'utf8')
          );

          if (!Array.isArray(data) || data.length === 0) {
            throw new Error('Calendar is empty');
          }

          const sources = new Set(data.map(x => x.source));

          for (const source of ['FED', 'BLS', 'BEA']) {
            if (!sources.has(source)) {
              throw new Error('Missing source: ' + source);
            }
          }

          console.log('CALENDAR VALIDATION : PASS');
          console.log('Events:', data.length);
          console.log('Sources:', [...sources].sort().join(', '));
          "

      - name: Commit calendar changes
        run: |
          if git diff --quiet -- data/macro-calendar.json; then
            echo "No calendar changes."
            exit 0
          fi

          git config user.name "NEXUS Macro Bot"
          git config user.email "nexus-macro-bot@users.noreply.github.com"

          git add data/macro-calendar.json
          git commit -m "Auto-update macro calendar"
          git push
